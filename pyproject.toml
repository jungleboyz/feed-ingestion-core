[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-ingestion-core"
version = "0.1.0"
description = "Domain-agnostic content ingestion engine: feed fetching, transcript extraction, embeddings, semantic scoring, vector dedup, summarization. Extracted from ai-news-agent for reuse (ARCH-008)."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.10",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=2.0.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.2.0",
    "numpy>=1.24.0",
    "chromadb>=0.4.0",
    "youtube-transcript-api>=0.6.0",
    "anthropic>=0.18.0",
]

[project.optional-dependencies]
firecrawl = ["firecrawl-py>=1.0.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["feed_ingestion_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
